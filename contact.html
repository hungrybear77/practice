<body>
    <div class="ambient">
        <span class="orb orb--one"></span>
        <span class="orb orb--two"></span>
        <span class="orb orb--three"></span>
    </div>

    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">Animal Face Lab</span>
                <span class="brand-sub">강아지 · 고양이 동물상 테스트</span>
            </div>
            <nav class="site-nav">
                <a href="index.html">홈</a>
                <a href="how-it-works.html">테스트 원리</a>
                <a href="faq.html">FAQ</a>
                <a href="about.html">소개</a>
                <a href="contact.html" class="is-active">문의</a>
            </nav>
            <div class="status-pill">문의하기</div>
        </header>

        <section class="content-page">
            <div>
                <p class="eyebrow">Contact</p>
                <h1>문의하기</h1>
                <p>제휴, 협업, 피드백 모두 환영합니다.</p>
            </div>

            <div>
                <h2>이메일</h2>
                <p>contact@animalfacelab.com</p>
            </div>

            <div>
                <h2>문의 폼</h2>
                <form class="contact-form" action="https://formspree.io/f/xlgwajng" method="POST">
                    <label class="control">
                        <span>이름</span>
                        <input type="text" name="name" placeholder="담당자 성함" required>
                    </label>
                    <label class="control">
                        <span>이메일</span>
                        <input type="email" name="email" placeholder="you@company.com" required>
                    </label>
                    <label class="control">
                        <span>회사 / 브랜드</span>
                        <input type="text" name="company" placeholder="회사명 또는 브랜드명">
                    </label>
                    <label class="control control--full">
                        <span>문의 내용</span>
                        <textarea name="message" rows="6" placeholder="어떤 협업을 원하시나요?" required></textarea>
                    </label>
                    <div class="form-footer">
                        <button class="cta" type="submit">문의 보내기</button>
                        <p class="hint">제출 시 개인정보 처리에 동의한 것으로 간주합니다.</p>
                    </div>
                </form>
            </div>
        </section>

        <footer class="site-footer">
            <div>
                <span class="brand-mark">Animal Face Lab</span>
                <p class="footer-note">동물상 테스트는 재미를 위한 콘텐츠이며, 결과는 참고용입니다.</p>
            </div>
            <div class="footer-links">
                <a href="privacy.html">개인정보처리방침</a>
                <a href="terms.html">이용약관</a>
                <a href="ads.txt">ads.txt</a>
            </div>
        </footer>
    </main>
</body>
</html>
